# Ory Kratos — minimal dev config for the two React test apps.
# Everything uses "localhost" so the session cookie is shared by both apps
# (cookies ignore ports, and localhost:4433 <-> localhost:5174/5175 is same-site).
version: v1.3.1

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:5174
        - http://localhost:5175
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Content-Type, Cookie, X-Session-Token]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:5174/
  allowed_return_urls:
    - http://localhost:5174
    - http://localhost:5175

  methods:
    password:
      enabled: true
      config:
        # Dev only: skip the haveibeenpwned lookup so the test works offline.
        haveibeenpwned_enabled: false

  flows:
    error:
      ui_url: http://localhost:5174/#/error
    login:
      ui_url: http://localhost:5174/#/login
    registration:
      ui_url: http://localhost:5174/#/register
      after:
        password:
          hooks:
            - hook: session   # log the user in right after sign-up
    logout:
      after:
        default_browser_return_url: http://localhost:5174/#/login

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 24h

log:
  level: info
  format: text

# Secrets are NOT stored here. docker-compose injects them from ory-kratos/.env
# (SECRETS_COOKIE / SECRETS_CIPHER). Copy .env.example to .env and fill them in.
